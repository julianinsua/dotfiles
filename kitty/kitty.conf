font_family       JetBrainsMonoNL Nerd Font Mono

font_size 11.5

disable_ligatures always

modify_font cell_height 105%
visual_bell_duration 0.0
enable_audio_bell no

dynamic_background_opacity yes
background_opacity 1

# Allow remote control to use jupyter with nvim through vim-jukit
allow_remote_control yes

# Stop prompting to confirm closing
confirm_os_window_close 0

# Stop mac's anoying unicode signs on opt+key
macos_option_as_alt both

# Disable C-S-h,j,k,l kitty shortcuts (I use them in nvim)
map ctrl+shift+h
map ctrl+shift+h send_text all \x1b[1;6H
map ctrl+shift+j
map ctrl+shift+h send_text all \x1b[1;6J
map ctrl+shift+k
map ctrl+shift+h send_text all \x1b[1;6K
map ctrl+shift+l
map ctrl+shift+h send_text all \x1b[1;6L


# Tokyo Night (Night) colorscheme for kitty
# The basic colors
foreground              #C0CAF5
background              #1A1B26
selection_foreground    #1A1B26
selection_background    #33467C

# Cursor colors
cursor                  #C0CAF5
cursor_text_color       #1A1B26

# URL underline color when hovering with mouse
url_color               #7AA2F7

# Kitty window border colors
active_border_color     #7AA2F7
inactive_border_color   #292E42
bell_border_color       #E0AF68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1A1B26
active_tab_background   #7AA2F7
inactive_tab_foreground #C0CAF5
inactive_tab_background #292E42
tab_bar_background      #1A1B26

# Colors for marks (marked text in the terminal)
mark1_foreground #1A1B26
mark1_background #7AA2F7
mark2_foreground #1A1B26
mark2_background #9ECE6A
mark3_foreground #1A1B26
mark3_background #BB9AF7

# The 16 terminal colors

# black
color0  #15161E
color8  #414868

# red
color1  #F7768E
color9  #F7768E

# green
color2  #9ECE6A
color10 #9ECE6A

# yellow
color3  #E0AF68
color11 #E0AF68

# blue
color4  #7AA2F7
color12 #7AA2F7

# magenta
color5  #BB9AF7
color13 #BB9AF7

# cyan
color6  #7DCFFF
color14 #7DCFFF

# white
color7  #A9B1D6
color15 #C0CAF5


